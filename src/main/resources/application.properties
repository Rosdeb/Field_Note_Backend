spring.application.name=field_notes
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
fieldnotes.session-days=30
fieldnotes.jwt.secret=${JWT_SECRET:field-notes-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-security}
fieldnotes.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
fieldnotes.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
spring.jackson.deserialization.fail-on-unknown-properties=true
